name: iOS build (unsigned research IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/v1.2-anc-ambient-toggle ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild \
            -project XM4Control.xcodeproj \
            -scheme XM4Control \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for local signing
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphoneos/XM4Control.app"
          test -f "$APP/Info.plist"
          test -f "$APP/XM4Control"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test "$EXECUTABLE" = "XM4Control"
          test -f "$APP/$EXECUTABLE"
          echo "Verified CFBundleExecutable: $EXECUTABLE"
          EXT="$APP/PlugIns/XM4StatusWidget.appex"
          test -f "$EXT/Info.plist"
          WIDGET_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$EXT/Info.plist")
          test -f "$EXT/$WIDGET_EXECUTABLE"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          EXT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$EXT/Info.plist")
          test "$APP_VERSION" = "$EXT_VERSION"
          test -d "$APP/Metadata.appintents"
          echo "Verified WidgetKit extension + AppIntents metadata; version=$APP_VERSION"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (
            cd dist
            /usr/bin/zip -q -r -X XM4Control-unsigned.ipa Payload
          )
          /usr/bin/unzip -l dist/XM4Control-unsigned.ipa | head -n 15
          /usr/bin/unzip -Z -1 dist/XM4Control-unsigned.ipa | grep -q 'Payload/XM4Control.app/PlugIns/XM4StatusWidget.appex/XM4StatusWidget'
          echo "Verified widget binary inside unsigned IPA"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XM4Control-unsigned-ipa
          path: dist/XM4Control-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.2.1
        if: github.ref == 'refs/heads/feature/v1.2-anc-ambient-toggle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > dist/RELEASE_NOTES.md <<'EOF'
          ## XM4Control v1.2.1

          Based on the v1.2.0 release, with one additional Shortcuts action:

          - **XM4 降噪／環境音切換** — toggles ANC ↔ AMBIENT without entering OFF. If currently OFF, the first activation enters ANC.
          - The original **XM4 三模式循環** action remains unchanged.
          - v1.2.0 WidgetKit controls, Sony battery probe, and other existing features are retained.
          - Uses the actual Sony ExternalAccessory mode GET, a single SET, ACK, and independent mode readback. No automatic SET retry.

          The IPA is **unsigned** and requires appropriate signing before installation on iPhone. The new two-mode Shortcut has compiled in CI but requires on-device verification.
          EOF
          gh release create v1.2.1 dist/XM4Control-unsigned.ipa#XM4Control-v1.2.1-UNSIGNED.ipa \
            --target "$GITHUB_SHA" \
            --title "XM4Control 1.2.1 — ANC / Ambient Shortcut" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest
